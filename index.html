<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guys?</title>

    <!-- Tailwind CDN: the src has to live INSIDE the tag, not between the tags -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- This is the line that was completely missing before.
         Without it, style.css never gets loaded by the page. -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="content" role="main" class="w-full max-w-md mx-auto p-6">
      <div class="mt-7 bg-white rounded-xl shadow-lg dark:bg-gray-800 dark:border-gray-700 border-2 border-indigo-300">
        <div class="p-4 sm:p-7">
          <div class="text-center">
            <h1 id="headline" class="block text-2xl font-bold text-gray-800 dark:text-white">Guys?</h1>
            <p class="mt-2 text-sm text-white-600 dark:text-white mega-text">
              Puad kee?
            </p>

            <!-- Points at your actual mp3 now, not a website homepage -->
            <audio id="clickSound" src="sound.mp3" preload="auto"></audio>

            <!-- onclick now starts the countdown instead of redirecting right away -->
            <button
              type="button"
              class="py-6 px-10 inline-flex justify-center items-center gap-2 rounded-md border border-transparent font-semibold bg-red-500 text-white hover:bg-black focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all text-sm dark:focus:ring-offset-gray-800 toilet-btn"
              onclick="startCountdown()"
            >
              toilet here
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Hidden until startCountdown() runs. display:none in the CSS keeps
         it invisible until we need it.
         muted = the video's own soundtrack won't play.
         playsinline = stops it force-opening fullscreen on iPhones.
         We don't add "controls" or "loop" on purpose - it should just
         play once through and be done. -->
    <div id="countdownOverlay">
      <video id="countdownVideo" src="countdown.mp4" muted playsinline></video>
    </div>

    <!-- Scripts go right before </body> so the page's HTML loads first -->
    <script src="script.js">
      // Put as many links in here as you want, separated by commas.
      // Every time the button is clicked, one gets picked at random.
      
    </script>
  </body>
</html>
